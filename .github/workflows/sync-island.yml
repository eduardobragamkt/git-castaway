name: Sync Island

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-island]
  watch:
    types: [started]
  fork:

permissions:
  contents: write

# Em rajadas de eventos, fica uma execução rodando e no máximo uma na fila.
concurrency:
  group: sync-island
  cancel-in-progress: false

jobs:
  sync:
    # Forks não precisam deste workflow: as ilhas deles vivem na URL da Mãe.
    if: github.repository == 'eduardobragamkt/git-castaway'
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por hash, para que uma etiqueta adulterada não mude o que roda aqui.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Testar regras
        run: npm test

      - name: Atualizar arquipelago.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Estrelas e forks precisam aparecer logo, então atualizam menos ilhas.
          FORK_REFRESH_BUDGET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '120' || '20' }}
        run: node scripts/update-data.js

      - name: Publicar mudanças
        run: |
          if git diff --quiet -- data/arquipelago.json; then
            echo "Nada para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arquipelago.json
          git commit -m "chore(ilha): sincroniza o arquipélago"
          git pull --rebase origin main
          git push origin HEAD:main
