# Arquivo gerado por scripts/build-issue-form.js. Edite data/garrafas.json.
name: Mandar uma garrafa / Send a bottle
description: Escolha uma mensagem para a ilha principal. / Pick a message for the main island.
title: "Garrafa / Bottle"
body:
  - type: markdown
    attributes:
      value: |
        Só as mensagens desta lista aparecem no jogo. O título e qualquer outro texto nunca são exibidos.

        Only the messages on this list appear in the game. The title and any other text are never shown.
  - type: dropdown
    id: mensagem
    attributes:
      label: Mensagem da garrafa
      description: A garrafa fica na praia por 30 minutos. / The bottle stays on the beach for 30 minutes.
      options:
        - "Alguém aí? Ótima vista, péssimo Wi-Fi. / Anyone out there? Great view, terrible Wi-Fi."
        - "Fiz push --force e acordei aqui. / I ran push --force and woke up here."
        - "Mande cocos. Aqui só tem merge conflict. / Send coconuts. All I have are merge conflicts."
        - "Um navio passou. Não deixou nenhuma estrela. / A ship went by. It left no star."
        - "Pesquei um bug. Era deste tamanho! / I caught a bug. It was THIS big!"
        - "Hoje o tubarão revisou meu PR. / The shark reviewed my PR today."
        - "Meu castelo de areia ainda está em beta. / My sandcastle is still in beta."
        - "Funciona na minha ilha. / Works on my island."
        - "Sem resgate ainda. Seguimos em produção. / No rescue yet. Still in production."
        - "Achei um baú. Dentro, só código legado. / Found a chest. Only legacy code inside."
        - "Bom dia do outro lado do oceano! / Good morning from across the ocean!"
        - "Boa noite, náufrago. O deploy pode esperar. / Good night, castaway. The deploy can wait."
        - "Linda palmeira. Posso dar um fork? / Nice palm tree. Can I fork it?"
        - "Sua ilha está linda. Continue commitando! / Your island looks great. Keep committing!"
        - "Sua ilha sente sua falta. Volte a codar! / Your island misses you. Come back and code!"
        - "Achei sua garrafa. Respondo com esta. / Found your bottle. This is my reply."
        - "A maré levou minha branch. / The tide took my branch."
        - "Perdi o mapa, mas ainda tenho o git log. / Lost the map, but I still have git log."
        - "Uma gaivota roubou meu sanduíche e meu token. / A seagull stole my sandwich and my token."
        - "Socorro! Alguém sabe como sair do Vim? / Help! Does anyone know how to exit Vim?"
        - "Construí uma cabana. Sem testes. / Built a hut. No tests."
        - "O sol nasceu. O build, não. / The sun came up. The build did not."
        - "Acenei para um avião. Era um satélite. / Waved at a plane. It was a satellite."
        - "Obrigado por este arquipélago! / Thanks for this archipelago!"
    validations:
      required: true
