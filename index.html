<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Git Castaway</title>
    <meta name="description" content="A living pixel art archipelago powered by public GitHub activity." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="mar" role="img" aria-label="An ocean with pixel art islands, one for each participant"></canvas>

    <header id="hud">
      <div class="hud-topo">
        <h1>Git Castaway</h1>
        <div class="idioma" data-idioma></div>
      </div>
      <p id="modo"></p>
      <ul id="contadores">
        <li title="Stars">★ <span id="estrelas">0</span></li>
        <li id="contador-forks" title="Forks">⑂ <span id="forks">0</span></li>
      </ul>
    </header>

    <nav id="acoes">
      <button id="voltar" type="button" hidden></button>
      <button id="criar-ilha" type="button"></button>
      <button id="leia-me" type="button"></button>
    </nav>

    <nav id="zoom">
      <button id="zoom-mais" type="button">+</button>
      <output id="zoom-valor">100%</output>
      <button id="zoom-menos" type="button">−</button>
      <button id="zoom-ajustar" type="button">⤢</button>
      <button id="tela-cheia" type="button" hidden>
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
          <path id="icone-tela-cheia" fill="currentColor" d="M1 1h5v2H3v3H1V1zm9 0h5v5h-2V3h-3V1zM1 10h2v3h3v2H1v-5zm12 0h2v5h-5v-2h3v-3z" />
        </svg>
      </button>
    </nav>

    <div id="balao" role="status" hidden></div>
    <aside id="cartao" role="dialog" aria-labelledby="cartao-titulo" tabindex="-1" hidden></aside>

    <div id="fundo-modal" hidden>
      <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" tabindex="-1"></div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
