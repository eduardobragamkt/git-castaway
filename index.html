<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Git Castaway</title>
    <meta name="description" content="A living pixel art archipelago powered by public GitHub activity." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="ocean" role="img" aria-label="An ocean with pixel art islands, one for each participant"></canvas>

    <header id="hud">
      <div class="hud-header">
        <h1>Git Castaway</h1>
        <div class="language-switch" data-language-switch></div>
      </div>
      <p id="mode"></p>
      <ul id="counters">
        <li title="Stars">★ <span id="stars">0</span></li>
        <li id="fork-counter" title="Forks">⑂ <span id="forks">0</span></li>
      </ul>
    </header>

    <nav id="actions">
      <button id="back" type="button" hidden></button>
      <button id="create-island" type="button"></button>
      <button id="read-me" type="button"></button>
      <button id="replay-intro" type="button"></button>
    </nav>

    <nav id="zoom">
      <button id="zoom-in" type="button">+</button>
      <output id="zoom-value">100%</output>
      <button id="zoom-out" type="button">−</button>
      <button id="zoom-fit" type="button">⤢</button>
      <button id="fullscreen" type="button" hidden>
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
          <path id="fullscreen-icon" fill="currentColor" d="M1 1h5v2H3v3H1V1zm9 0h5v5h-2V3h-3V1zM1 10h2v3h3v2H1v-5zm12 0h2v5h-5v-2h3v-3z" />
        </svg>
      </button>
    </nav>

    <div id="balloon" role="status" hidden></div>
    <aside id="island-card" role="dialog" aria-labelledby="island-card-title" tabindex="-1" hidden></aside>

    <div id="intro" hidden>
      <div id="intro-curtain"></div>
      <div id="intro-terminal" aria-hidden="true"></div>
      <p id="intro-skip"></p>
    </div>

    <div id="modal-backdrop" hidden>
      <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
